<!DOCTYPE html>
<!--

  License, v. 2.0. If a copy of the MPL was not distributed with this
  file, You can obtain one at https://mozilla.org/MPL/2.0/.

  Mock-ups of the face liveness screens of the Registration Client.
  Open without parameter to see all screens. Open with ?screen=<id> to see one screen
  at 1280 x 800, as rendered by render_mockups.py.
  The face in the preview is a drawn silhouette: no real face is used.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liveness screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colours of the Registration Client stylesheet (application.css) */
    --blue: #005baa;
    --blue-dark: #004887;
    --grey: #666666;
    --line: #c9c9c9;
    --surface: #f4f4f4;
    --white: #ffffff;
    --black: #000000;
    /* Status colours, darkened from the client's green and red so that text keeps a 4.5:1 contrast */
    --green: #2e6b08;
    --green-mark: #45a30a;
    --green-bg: #eaf5e3;
    --amber: #8a4500;
    --amber-mark: #e08a00;
    --amber-bg: #fff4e5;
    --red: #b71c1c;
    --red-bg: #fdecec;
    --info-bg: #e8f1fa;
    --camera: #36414d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, Arial, sans-serif; color: var(--black); background: var(--surface); }

  /* Gallery, when no screen is selected */
  .gallery { padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(660px, 1fr)); gap: 32px; }
  .gallery figure { margin: 0; }
  .gallery figcaption { font-size: 15px; color: var(--grey); margin: 0 0 8px; }
  .gallery .thumb { width: 640px; height: 400px; overflow: hidden; border: 1px solid var(--line); background: var(--white); }
  .gallery .thumb .window { transform: scale(0.5); transform-origin: 0 0; }

  /* Application window */
  .window { width: 1280px; height: 800px; background: var(--white); display: flex; flex-direction: column; overflow: hidden; }
  .appbar { height: 52px; background: var(--blue-dark); color: var(--white); display: flex; align-items: center; padding: 0 24px; gap: 28px; font-size: 14px; }
  .appbar .product { font-size: 18px; font-weight: 500; margin-right: auto; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 14px; background: rgba(255,255,255,0.14); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.online { background: #7ed957; }
  .dot.offline { background: #ffc857; }

  .tracker { height: 46px; border-bottom: 1px solid var(--line); display: flex; align-items: stretch; padding: 0 24px; gap: 32px; font-size: 14px; color: var(--grey); }
  .tracker span { display: flex; align-items: center; border-bottom: 3px solid transparent; }
  .tracker .active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
  .tracker .done { color: var(--black); }

  .main { flex: 1; display: grid; grid-template-columns: 230px 1fr 300px; gap: 24px; padding: 20px 24px; min-height: 0; }

  .modalities { border-right: 1px solid var(--line); padding-right: 16px; }
  .modalities h2, .details h2 { font-size: 15px; font-weight: 500; color: var(--blue); margin: 0 0 12px; }
  .modality { padding: 12px 12px 12px 14px; border-left: 4px solid transparent; margin-bottom: 6px; font-size: 15px; }
  .modality small { display: block; color: var(--grey); font-size: 13px; margin-top: 3px; }
  .modality.current { border-left-color: var(--blue); background: var(--info-bg); }

  .capture { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .capture .heading { align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .capture .heading h1 { font-size: 20px; font-weight: 500; color: var(--blue); margin: 0; }
  .capture .heading span { font-size: 14px; color: var(--grey); }

  .preview { position: relative; width: 448px; height: 336px; background: radial-gradient(circle at 50% 40%, #4a5866, var(--camera) 70%); border-radius: 4px; overflow: hidden; }
  .preview > svg { position: absolute; inset: 0; }
  .preview .off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #d8dee4; font-size: 16px; background: #2b333c; }
  .preview .off svg { width: 64px; height: 64px; }

  .band { width: 640px; max-width: 100%; margin-top: 14px; padding: 14px 22px; display: flex; align-items: center; gap: 18px; border-left: 6px solid; }
  .band .icon { flex: none; width: 52px; height: 52px; }
  .band .text { font-size: 28px; line-height: 1.2; font-weight: 500; }
  .band.info { background: var(--info-bg); border-color: var(--blue); color: var(--blue-dark); }
  .band.action { background: var(--blue-dark); border-color: var(--blue-dark); color: var(--white); }
  .band.action .text { font-size: 44px; }
  .band.success { background: var(--green-bg); border-color: var(--green-mark); color: var(--green); }
  .band.attention { background: var(--amber-bg); border-color: var(--amber-mark); color: var(--amber); }
  .band.error { background: var(--red-bg); border-color: var(--red); color: var(--red); }

  .sub { width: 640px; max-width: 100%; margin-top: 10px; font-size: 15px; color: var(--grey); line-height: 1.5; }
  .sub ul { margin: 4px 0 0; padding-left: 20px; }
  .timer { display: flex; align-items: center; gap: 12px; }
  .timer .track { flex: 1; height: 8px; background: #dfe5ea; border-radius: 4px; overflow: hidden; }
  .timer .fill { height: 100%; background: var(--blue); }

  .details { border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e6e6e6; font-size: 14px; }
  .row span:first-child { color: var(--grey); }
  .row span:last-child { text-align: right; font-weight: 500; }
  .row .ok { color: var(--green); }
  .row .warn { color: var(--amber); }
  .row .bad { color: var(--red); }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .diagnostic { margin-top: 16px; border: 1px dashed var(--grey); padding: 10px 12px; font-size: 13px; }
  .diagnostic h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--grey); }
  .diagnostic .row { padding: 4px 0; font-size: 13px; }

  button { font-family: inherit; font-size: 15px; height: 40px; padding: 0 20px; border-radius: 3px; cursor: pointer; }
  .btn-primary { background: var(--blue-dark); color: var(--white); border: 1px solid var(--blue-dark); }
  .btn-outline { background: var(--white); color: var(--blue); border: 1px solid var(--blue); }
  button:disabled { background: #e3e3e3; color: #8a8a8a; border-color: #d0d0d0; cursor: default; }
  button:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }

  .footer { height: 64px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 24px; }
  .footer button { width: 140px; }

  /* Authentication screens */
  .auth { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--surface); }
  .card { width: 600px; background: var(--white); border: 1px solid var(--line); padding: 22px 28px 24px; display: flex; flex-direction: column; align-items: center; }
  .card h1 { align-self: stretch; font-size: 22px; font-weight: 500; color: var(--blue); margin: 0 0 4px; }
  .card .context { align-self: stretch; font-size: 14px; color: var(--grey); margin: 0 0 14px; }
  .modes { align-self: stretch; display: flex; gap: 8px; margin-bottom: 12px; }
  .modes span { padding: 6px 14px; border: 1px solid var(--line); border-radius: 16px; font-size: 13px; color: var(--grey); }
  .modes .on { border-color: var(--blue); color: var(--blue); background: var(--info-bg); font-weight: 500; }
  .field { align-self: stretch; display: flex; gap: 12px; align-items: center; font-size: 14px; margin-bottom: 12px; }
  .field label { color: var(--grey); width: 90px; }
  .field div { flex: 1; border: 1px solid var(--line); padding: 8px 10px; }
  .card .preview { width: 400px; height: 300px; }
  .card .band { width: 100%; margin-top: 12px; padding: 12px 16px; }
  .card .band .text { font-size: 22px; }
  .card .band.action .text { font-size: 32px; }
  .card .band .icon { width: 40px; height: 40px; }
  .card .sub { width: 100%; }
  .card .buttons { align-self: stretch; display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

  /* Second screen turned towards the resident */
  .resident { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--white); padding: 40px; text-align: center; }
  .resident .step { font-size: 26px; color: var(--grey); }
  .resident .big-icon { width: 180px; height: 180px; color: var(--blue-dark); }
  .resident .instruction { font-size: 76px; font-weight: 500; color: var(--blue-dark); line-height: 1.1; max-width: 1100px; }
  .resident .timer { width: 720px; font-size: 24px; color: var(--grey); }
  .resident .timer .track { height: 14px; border-radius: 7px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Pictograms, drawn for these mock-ups. They always come with a text.
const ICONS = {
  info: '<circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><rect x="22" y="20" width="4" height="15" fill="currentColor"/><circle cx="24" cy="14" r="2.6" fill="currentColor"/>',
  eye: '<path d="M4 24c5-9 12-14 20-14s15 5 20 14c-5 9-12 14-20 14S9 33 4 24z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M10 24c4 5 9 7 14 7s10-2 14-7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 33l-3 4M24 35v5M34 33l3 4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  smile: '<circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="17" cy="19" r="2.6" fill="currentColor"/><circle cx="31" cy="19" r="2.6" fill="currentColor"/><path d="M14 28c3 5 6 7 10 7s7-2 10-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  left: '<path d="M30 10L14 24l16 14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 24h26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  right: '<path d="M18 10l16 14-16 14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 24H6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  check: '<circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 25l7 7 13-15" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
  cross: '<circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 16l16 16M32 16L16 32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
  sun: '<circle cx="24" cy="24" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M38 10l-4 4M14 34l-4 4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  still: '<rect x="12" y="10" width="8" height="28" rx="2" fill="currentColor"/><rect x="28" y="10" width="8" height="28" rx="2" fill="currentColor"/>',
  device: '<rect x="6" y="12" width="28" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="23" r="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M34 19l8-5v18l-8-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M8 42L42 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  person: '<circle cx="24" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 42c2-9 8-14 16-14s14 5 16 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
};
const icon = (name, cls = 'icon') => `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true">${ICONS[name]}</svg>`;

const RING = { checking: '#ffffff', action: '#7fb8ec', success: '#7ed957', attention: '#ffc857', error: '#ff8a80', none: 'transparent' };

// Camera view with a drawn silhouette and the positioning oval. The oval doubles as progress ring.
function preview(p, w = 448, h = 336) {
  if (p.off) {
    return `<div class="preview" style="width:${w}px;height:${h}px"><div class="off">${icon('device', 'icon')}<span>No image from the face device</span></div></div>`;
  }
  const cx = w / 2, cy = h * 0.47, rx = w * 0.25, ry = h * 0.42;
  const dim = p.dark ? 'filter:brightness(0.42)' : '';
  const person = p.empty ? '' : `
    <g style="${dim}">
      <path d="M${cx - w * 0.33} ${h} C ${cx - w * 0.31} ${h * 0.80}, ${cx - w * 0.15} ${h * 0.74}, ${cx} ${h * 0.74} C ${cx + w * 0.15} ${h * 0.74}, ${cx + w * 0.31} ${h * 0.80}, ${cx + w * 0.33} ${h} Z" fill="#8795a3"/>
      <rect x="${cx - w * 0.055}" y="${h * 0.60}" width="${w * 0.11}" height="${h * 0.16}" fill="#7c8a98"/>
      <ellipse cx="${cx}" cy="${h * 0.43}" rx="${w * 0.16}" ry="${h * 0.27}" fill="#9aa8b5"/>
    </g>`;
  const ring = RING[p.ring || 'checking'];
  const progress = Math.max(0, Math.min(100, p.progress ?? 0));
  return `<div class="preview" style="width:${w}px;height:${h}px">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
      ${person}
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="5"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${ry}" ry="${rx}" fill="none" stroke="${ring}" stroke-width="7" pathLength="100"
               stroke-dasharray="${progress} 100" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    </svg></div>`;
}

function band(b) {
  return `<div class="band ${b.tone}" role="status">${icon(b.icon)}<div class="text">${b.text}</div></div>`;
}

function timer(t) {
  return `<div class="timer"><span>${t.label}</span><div class="track"><div class="fill" style="width:${t.share}%"></div></div><span>${t.left}</span></div>`;
}

function rows(list) {
  return list.map(([k, v, cls]) => `<div class="row"><span>${k}</span><span class="${cls || ''}">${v}</span></div>`).join('');
}

function residentScreen(s) {
  const network = s.offline
    ? '<span class="chip"><span class="dot offline"></span>Offline</span>'
    : '<span class="chip"><span class="dot online"></span>Online</span>';
  const buttons = (s.buttons || []).map(([label, cls, disabled]) =>
    `<button class="${cls}" ${disabled ? 'disabled' : ''}>${label}</button>`).join('');
  const diagnostic = s.diagnostic
    ? `<div class="diagnostic"><h3>Diagnostic mode, enabled by configuration</h3>${rows(s.diagnostic)}</div>` : '';
  return `<div class="window">
    <div class="appbar"><span class="product">Registration Client</span><span>Centre 10002</span><span>Operator: operator1</span>${network}</div>
    <div class="tracker"><span class="done">Consent</span><span class="done">Demographic details</span><span class="done">Documents</span><span class="active">Biometrics</span><span>Preview</span><span>Authentication</span></div>
    <div class="main">
      <div class="modalities"><h2>Applicant biometrics</h2>
        <div class="modality">Fingerprints<small>Captured</small></div>
        <div class="modality">Iris<small>Captured</small></div>
        <div class="modality current">Face<small>${s.faceStatus}</small></div>
        <div class="modality">Exception photo<small>Not required</small></div>
      </div>
      <div class="capture">
        <div class="heading"><h1>Face</h1><span>${s.headingNote || ''}</span></div>
        ${preview(s.preview)}
        ${band(s.band)}
        ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
      </div>
      <div class="details"><h2>Capture details</h2>
        ${rows(s.details)}
        ${diagnostic}
        <div class="actions">${buttons}</div>
      </div>
    </div>
    <div class="footer"><button class="btn-outline">Back</button><button class="btn-primary" ${s.nextEnabled ? '' : 'disabled'}>Next</button></div>
  </div>`;
}

function authScreen(s) {
  const fr = s.lang === 'fr';
  const network = s.offline
    ? `<span class="chip"><span class="dot offline"></span>${fr ? 'Hors ligne' : 'Offline'}</span>`
    : `<span class="chip"><span class="dot online"></span>${fr ? 'En ligne' : 'Online'}</span>`;
  const modeNames = fr ? ['Mot de passe', 'Empreinte', 'Iris', 'Visage'] : ['Password', 'Fingerprint', 'Iris', 'Face'];
  const modes = modeNames.map((m, i) => `<span class="${i === 3 ? 'on' : ''}">${m}</span>`).join('');
  const buttons = (s.buttons || []).map(([label, cls, disabled]) =>
    `<button class="${cls}" ${disabled ? 'disabled' : ''}>${label}</button>`).join('');
  return `<div class="window" lang="${s.lang || 'en'}">
    <div class="appbar"><span class="product">Registration Client</span><span>Centre 10002</span>${network}</div>
    <div class="auth"><div class="card">
      <h1>${s.title}</h1><p class="context">${s.context}</p>
      <div class="modes" aria-label="${fr ? 'Mode de connexion' : 'Sign-in method'}">${modes}</div>
      <div class="field"><label>${s.userLabel || 'Username'}</label><div>${s.user}</div></div>
      ${preview(s.preview, 400, 300)}
      ${band(s.band)}
      ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
      <div class="buttons">${buttons}</div>
    </div></div>
  </div>`;
}

function residentView(s) {
  return `<div class="window" lang="${s.lang}">
    <div class="resident">
      <div class="step">${s.step}</div>
      ${icon(s.icon, 'big-icon')}
      <div class="instruction">${s.text}</div>
      ${timer(s.timer)}
    </div>
  </div>`;
}

const D_LIVE = (state, cls) => ['Liveness', state, cls];

const SCREENS = [
  { id: 'r01-checking', caption: 'Resident capture: passive check in progress', kind: 'resident',
    faceStatus: 'Checking liveness', headingNote: 'The capture starts once liveness is verified',
    preview: { ring: 'checking', progress: 60 },
    band: { tone: 'info', icon: 'info', text: 'Checking face liveness…' },
    sub: 'Look at the camera. No action is needed.',
    details: [D_LIVE('Checking'), ['Attempt', '1 of 3'], ['Quality score', 'After capture'], ['Face device', 'Connected', 'ok']] },

  { id: 'r02-guidance-lighting', caption: 'Resident capture: guidance on a frame that cannot be used', kind: 'resident',
    faceStatus: 'Checking liveness', headingNote: 'The capture starts once liveness is verified',
    preview: { ring: 'attention', progress: 20, dark: true },
    band: { tone: 'attention', icon: 'sun', text: 'Improve the lighting' },
    sub: 'Make sure your face is clearly visible.',
    details: [D_LIVE('Checking'), ['Attempt', '1 of 3'], ['Quality score', 'After capture'], ['Face device', 'Connected', 'ok']] },

  { id: 'r03-hold-still', caption: 'Resident capture: active check, baseline before the instruction', kind: 'resident',
    faceStatus: 'Action requested', headingNote: 'Challenge 1 of 2',
    preview: { ring: 'action', progress: 10 },
    band: { tone: 'info', icon: 'still', text: 'Hold still' },
    sub: 'An instruction will appear in a moment.',
    details: [D_LIVE('Waiting for an action', 'warn'), ['Attempt', '1 of 3'], ['Quality score', 'After capture'], ['Face device', 'Connected', 'ok']] },

  { id: 'r04-challenge-blink', caption: 'Resident capture: active challenge, instruction readable from the resident\'s seat', kind: 'resident',
    faceStatus: 'Action requested', headingNote: 'Challenge 1 of 2',
    preview: { ring: 'action', progress: 35 },
    band: { tone: 'action', icon: 'eye', text: 'Please blink' },
    sub: timer({ label: 'Time left', share: 70, left: '6 s' }),
    details: [D_LIVE('Waiting for an action', 'warn'), ['Attempt', '1 of 3'], ['Quality score', 'After capture'], ['Face device', 'Connected', 'ok']] },

  { id: 'r05-challenge-turn', caption: 'Resident capture: second challenge, after the first action was detected', kind: 'resident',
    faceStatus: 'Action requested', headingNote: 'Challenge 2 of 2',
    preview: { ring: 'action', progress: 75 },
    band: { tone: 'action', icon: 'left', text: 'Please turn your head to the left' },
    sub: timer({ label: 'Time left', share: 45, left: '4 s' }),
    details: [D_LIVE('Waiting for an action', 'warn'), ['Challenge 1', 'Action detected', 'ok'], ['Attempt', '1 of 3'], ['Face device', 'Connected', 'ok']] },

  { id: 'r06-success', caption: 'Resident capture: liveness verified, face captured', kind: 'resident',
    faceStatus: 'Captured', headingNote: '',
    preview: { ring: 'success', progress: 100 },
    band: { tone: 'success', icon: 'check', text: 'Face captured successfully' },
    sub: 'Check the image, then go to the next step.',
    details: [D_LIVE('Verified', 'ok'), ['Attempt', '1 of 3'], ['Quality score', '87'], ['Face device', 'Connected', 'ok']],
    buttons: [['Capture again', 'btn-outline']], nextEnabled: true },

  { id: 'r07-failed-retry', caption: 'Resident capture: liveness not verified, a new attempt is possible', kind: 'resident',
    faceStatus: 'Not captured', headingNote: '',
    preview: { ring: 'error', progress: 100 },
    band: { tone: 'error', icon: 'cross', text: 'We could not verify face liveness. Please try again.' },
    sub: 'Attempt 1 of 3. You can try again.<ul><li>Look directly at the camera</li><li>Keep your face inside the frame</li><li>Follow the requested action</li></ul>',
    details: [D_LIVE('Not verified', 'bad'), ['Attempt', '1 of 3'], ['Quality score', 'Not captured'], ['Face device', 'Connected', 'ok']],
    buttons: [['Try again', 'btn-primary']] },

  { id: 'r08-attack-generic', caption: 'Resident capture: attack detected, generic message only', kind: 'resident',
    faceStatus: 'Not captured', headingNote: '',
    preview: { ring: 'error', progress: 100 },
    band: { tone: 'error', icon: 'cross', text: 'Face verification could not be completed. Please try again.' },
    sub: 'Attempt 2 of 3. You can try again.',
    details: [D_LIVE('Not verified', 'bad'), ['Attempt', '2 of 3'], ['Quality score', 'Not captured'], ['Face device', 'Connected', 'ok']],
    buttons: [['Try again', 'btn-primary']] },

  { id: 'r09-max-attempts-exception', caption: 'Resident capture: attempts exhausted, exception process', kind: 'resident',
    faceStatus: 'Exception process', headingNote: '',
    preview: { ring: 'error', progress: 100 },
    band: { tone: 'error', icon: 'cross', text: 'Face verification could not be completed. Please follow the exception process.' },

function render(s) {
  if (s.kind === 'resident') return residentScreen(s);
  if (s.kind === 'auth') return authScreen(s);
  return residentView(s);
}

const wanted = new URLSearchParams(location.search).get('screen');
const root = document.getElementById('root');
if (wanted) {
  const s = SCREENS.find(x => x.id === wanted);
  root.innerHTML = s ? render(s) : `<p>Unknown screen: ${wanted}</p>`;
  if (s) document.documentElement.lang = s.lang || 'en';
} else {
  root.innerHTML = '<div class="gallery">' + SCREENS.map(s =>
    `<figure><figcaption>${s.caption}</figcaption><div class="thumb">${render(s)}</div></figure>`).join('') + '</div>';
}
